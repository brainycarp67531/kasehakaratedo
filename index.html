
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Landing · BrandName</title>
  <link rel="stylesheet" href="css/styles.css" />
  <meta name="description" content="Landing shell that loads page content dynamically" />
</head>
<body>
  <a class="skip-link" href="#main" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">Skip to content</a>
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a class="brand" href="#about" aria-label="Go to home">
        <img class="brand-logo" src="assets/logo.svg" alt="BrandName logo" width="36" height="36" />
        <span class="brand-name">BrandName</span>
      </a>
      <nav class="primary-nav" aria-label="Primary">
        <ul>
          <li><a href="#about" data-route="about">About</a></li>
          <li><a href="#services" data-route="services">Services</a></li>
          <li><a href="#contact" data-route="contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" role="main">
    <div class="container" id="content">
      <!-- Dynamic content will be injected here -->
      <noscript>
        <p>Please enable JavaScript to view the content here. Or visit:
          <a href="pages/about.html">About</a>,
          <a href="pages/services.html">Services</a>,
          <a href="pages/contact.html">Contact</a>.
        </p>
      </noscript>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <div>© <span id="year"></span> BrandName. All rights reserved.</div>
      <div><a href="mailto:hello@example.com" class="muted" style="color:inherit;text-decoration:none;">hello@example.com</a></div>
    </div>
  </footer>
  <script src="js/app.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
